---
gitlab_repo_edition: "gitlab-ce"
gitlab_package_name: "gitlab-ce"
gitlab_external_url: "https://gitlab.internal.example"
gitlab_initial_root_password: "{{ vault_gitlab_root_password }}"
gitlab_backup_cron: true
gitlab_registry_external_url: ""
nginx_ssl_certificate: ""
nginx_ssl_certificate_key: ""

# APT exact Omnibus Debian revision, e.g. "17.6.1-ce.0" — empty string => follow repository "latest".
gitlab_ce_apt_pin_version: ""
