---
# Common host baseline: packages, sysctl forward (bastion), nftables template
# Idempotent; O(n) tasks per host for full run
- name: Ensure baseline packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - nftables
      - unattended-upgrades
      - auditd
    state: present
    update_cache: true

- name: Harden SSH (password auth off, root key-only)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin prohibit-password' }
    - { regexp: '^#?KbdInteractiveAuthentication', line: 'KbdInteractiveAuthentication no' }
  notify: Restart sshd

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Deploy nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
  notify: Reload nftables

- name: Install fail2ban (abuse / brute-force dampening on exposed SSH)
  ansible.builtin.apt:
    name: fail2ban
    state: present
  when: common_install_fail2ban | bool

- name: Deploy fail2ban jail for sshd
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/90-sshd.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 10m
      bantime = 1h
      backend = systemd
  when: common_install_fail2ban | bool
  notify: Restart fail2ban

- name: Enable fail2ban service
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: common_install_fail2ban | bool
