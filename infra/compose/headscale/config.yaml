# Minimal skeleton — customise server_url BEFORE issuing client configs.
#
# Paths inside container correspond to compose volume mounts.
#
server_url: http://127.0.0.1:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090

private_key_path: /var/lib/headscale/private.key

noise:
  private_key_path: /var/lib/headscale/noise_private.key

ip_prefixes:
  - fd7a:115c:a1e0::/48

derp:
  server:
    enabled: false

dns_config:
  override_local_dns: true
  domains: []
  nameservers_global:
    - 1.1.1.1
  nameservers_split: {}

db_type: sqlite3
db_path: /var/lib/headscale/db.sqlite

log:
  format: plain
  level: info

policy:
  mode: db
  path: ""
